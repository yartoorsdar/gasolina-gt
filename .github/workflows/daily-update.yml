######## INICIA SCRIPT DE WORKFLOW DAILY UPDATE ########
name: Daily Update — GPP + Petróleo + Noticias

on:
  # Cada día a las 08:00 AM (hora Guatemala = UTC-6)
  schedule:
    - cron: '0 14 * * *'  # 14:00 UTC = 08:00 CST

  # Ejecución manual desde GitHub UI
  workflow_dispatch:

  # Disparar en push a main (para que los fixes se apliquen al instante)
  push:
    branches: [main]

jobs:
  update-daily:
    permissions:
      contents: write
    runs-on: windows-latest

    # Serializa schedule + push + dispatch: evita carreras en el commit/push de JSONs.
    concurrency:
      group: daily-update-global
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          playwright install chromium

      - name: Create data directories
        run: |
          New-Item -ItemType Directory -Force -Path "data\inbox\historico"
          New-Item -ItemType Directory -Force -Path "logs"

      - name: Validar feeds RSS
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/validar_feeds.py

      - name: Run GPP + petróleo + noticias + export JSONs
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          python -c "from datetime import datetime, timezone, timedelta; now_utc = datetime.utcnow().strftime('%H:%M'); now_gt = datetime.now(timezone(timedelta(hours=-6))).strftime('%H:%M'); print(f'UTC={now_utc} GT={now_gt}'); f=open('logs/debug_time.txt','w'); f.write(f'{now_utc}|{now_gt}')"
          python collector/main.py --memoria --alternos --petroleo --noticias --export

      - name: Commit and push updated JSONs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Configurar credenciales con GITHUB_TOKEN para el push
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/yartoorsdar/gasolina-gt.git
          # Memoria persistente: data/db/<producto>.csv es el historial acumulado
          # entre runs. Sin él, cada run nacería con DB vacía y perdería el historial.
          git add data/export/consolidado.json data/db/*.csv
          if git diff --cached --quiet; then
            echo "::notice::No changes to commit."
          else
            # Commit PRIMERO: con índice limpio, el rebase de abajo sí funciona.
            # (Antes fallaba en silencio: había cambios staged y || true lo ocultaba.)
            git commit -m "Daily update: GPP + petróleo + noticias [skip ci]"
            # Sincronizar por si main avanzó en paralelo; si hay conflicto se aborta
            # y el push de abajo deja la falla VISIBLE (los JSONs salen en el próximo run).
            git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
            # Sin || true: un rechazo de push queda ROJO, no se pierde en silencio.
            git push origin HEAD:main
            echo "::notice::OK JSONs pushed"
          fi
######## FINALIZA SCRIPT DE WORKFLOW DAILY UPDATE ########
