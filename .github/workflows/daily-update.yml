# ⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️⚙️
######## INICIA SCRIPT DE WORKFLOW DAILY UPDATE ########
name: Daily Update — GPP + Petróleo + Noticias

on:
  # RED DE SEGURIDAD: GitHub retrasa los crons gratuitos 4-6 h (medido en este repo), por eso
  # los runs puntuales de las 04:52 y 11:52 hora de Guatemala (para tener datos a las 05:00 y
  # 12:00) los DISPARA Cloudflare con workflow_dispatch (votos-api, scheduled). Este cron solo
  # corre si Cloudflare falló: scripts/frescura.py lo salta si ya hay datos de hace < 6 h.
  schedule:
    - cron: '0 16 * * *'

  # Ejecución manual desde GitHub UI y disparo puntual de Cloudflare
  workflow_dispatch:

  # Push a main: SOLO si cambia algo que afecta a los datos. Cambios de documentación o de
  # interfaz (index.html, tests, README...) ya no gastan llamadas de OilPriceAPI ni del LLM.
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'scripts/**'
      - 'config.json'
      - 'requirements.txt'
      - '.github/workflows/daily-update.yml'

jobs:
  update-daily:
    permissions:
      contents: write
    runs-on: windows-latest

    # Serializa schedule + push + dispatch: evita carreras en el commit/push de JSONs.
    concurrency:
      group: daily-update-global
      cancel-in-progress: false

    # UTF-8 en TODOS los pasos: la consola del runner Windows es cp1252 y un
    # print() con un carácter fuera de cp1252 (ej. "→") mataba el job (exit 1).
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Solo el run programado por GitHub puede saltarse (ver scripts/frescura.py).
      - name: Comprobar si ya hay datos frescos
        id: frescura
        shell: bash
        run: python scripts/frescura.py "${{ github.event_name }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.frescura.outputs.saltar != 'true'
        run: |
          pip install --no-cache-dir -r requirements.txt
          playwright install chromium

      - name: Create data directories
        if: steps.frescura.outputs.saltar != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path "data\inbox\historico"
          New-Item -ItemType Directory -Force -Path "data\inbox\votos"
          New-Item -ItemType Directory -Force -Path "logs"

      - name: Validar feeds RSS
        if: steps.frescura.outputs.saltar != 'true'
        continue-on-error: true
        run: python scripts/validar_feeds.py

      # Votos ciudadanos (votos-api, Cloudflare): baja los de ayer y hoy para la calibración.
      # Sin el secreto VOTOS_EXPORT_TOKEN o con el servidor caído se omite sin fallar el run.
      - name: Descargar votos ciudadanos
        if: steps.frescura.outputs.saltar != 'true'
        continue-on-error: true
        env:
          VOTOS_EXPORT_TOKEN: ${{ secrets.VOTOS_EXPORT_TOKEN || secrets.EXPORT_TOKEN }}
        run: python scripts/descargar_votos.py

      - name: Run GPP + petróleo + noticias + export JSONs
        if: steps.frescura.outputs.saltar != 'true'
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          python -c "from datetime import datetime, timezone, timedelta; now_utc = datetime.utcnow().strftime('%H:%M'); now_gt = datetime.now(timezone(timedelta(hours=-6))).strftime('%H:%M'); print(f'UTC={now_utc} GT={now_gt}'); f=open('logs/debug_time.txt','w'); f.write(f'{now_utc}|{now_gt}')"
          python collector/main.py --memoria --alternos --consenso --petroleo --noticias --export --calibracion

      - name: Commit and push updated JSONs
        if: steps.frescura.outputs.saltar != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Configurar credenciales con GITHUB_TOKEN para el push
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/yartoorsdar/gasolina-gt.git
          # Memoria persistente: data/db/<producto>.csv es el historial acumulado
          # entre runs. Sin él, cada run nacería con DB vacía y perdería el historial.
          git add data/export/consolidado.json data/db/*.csv
          if git diff --cached --quiet; then
            echo "::notice::No changes to commit."
          else
            # Commit PRIMERO: con índice limpio, el rebase de abajo sí funciona.
            # (Antes fallaba en silencio: había cambios staged y || true lo ocultaba.)
            git commit -m "Daily update: GPP + petróleo + noticias [skip ci]"
            # Sincronizar por si main avanzó en paralelo; si hay conflicto se aborta
            # y el push de abajo deja la falla VISIBLE (los JSONs salen en el próximo run).
            git pull --rebase origin main || { git rebase --abort 2>/dev/null || true; }
            # Sin || true: un rechazo de push queda ROJO, no se pierde en silencio.
            git push origin HEAD:main
            echo "::notice::OK JSONs pushed"
          fi
######## FINALIZA SCRIPT DE WORKFLOW DAILY UPDATE ########
