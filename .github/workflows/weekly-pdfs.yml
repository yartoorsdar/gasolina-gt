name: Weekly Update — Precios MEM (PDF)

on:
  # Lunes y Martes a las 09:00 AM (hora Guatemala = UTC-6)
  schedule:
    - cron: '0 15 * * 1'   # Lunes 09:00
    - cron: '0 15 * * 2'   # Martes 09:00

  # Ejecución manual desde GitHub UI
  workflow_dispatch:

jobs:
  update-pdfs:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt
          playwright install chromium

      - name: Create data directories
        run: |
          New-Item -ItemType Directory -Force -Path "data\inbox\historico"
          New-Item -ItemType Directory -Force -Path "logs"

      - name: Run PDF + historico + export JSONs
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python collector/main.py --precios-mem --historico --export

      - name: Commit and push updated JSONs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/export/*.json
          if git diff --cached --quiet; then
            echo "::notice::No changes to commit."
          else
            git commit -m "Weekly update: precios MEM PDF [skip ci]"
            git push
            echo "::notice::OK JSONs pushed"
          fi
